<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Finder — What Can I Cook?</title>
<style>
  :root {
    --bg: #faf6f1;
    --card: #ffffff;
    --accent: #e07a3a;
    --accent-hover: #c96a2e;
    --accent-light: #fdf0e6;
    --text: #2d2013;
    --text-secondary: #7a6a5a;
    --border: #e8ddd2;
    --tag-bg: #f3ece4;
    --tag-active: #e07a3a;
    --tag-active-text: #fff;
    --match-high: #2d9d4e;
    --match-mid: #d4a017;
    --match-low: #c0392b;
    --shadow: 0 2px 12px rgba(45,32,19,0.08);
    --shadow-lg: 0 8px 30px rgba(45,32,19,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #e07a3a 0%, #d4622a 50%, #c0522a 100%);
    color: white;
    padding: 2.5rem 1.5rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: drift 20s linear infinite;
  }
  @keyframes drift { to { transform: translate(30px, 30px); } }
  .header h1 { font-size: 2.2rem; font-weight: 700; position: relative; margin-bottom: 0.3rem; }
  .header p { opacity: 0.9; font-size: 1.05rem; position: relative; }

  /* Container */
  .container { max-width: 1100px; margin: 0 auto; padding: 0 1.2rem; }

  /* Ingredient Input Section */
  .input-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.5rem;
    margin-top: -1.5rem;
    position: relative;
    z-index: 2;
  }
  .input-section h2 {
    font-size: 1.1rem;
    margin-bottom: 0.8rem;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .ingredient-input {
    flex: 1;
    padding: 0.7rem 1rem;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .ingredient-input:focus { border-color: var(--accent); }
  .ingredient-input::placeholder { color: #bbb; }

  .btn {
    padding: 0.7rem 1.3rem;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-secondary { background: var(--tag-bg); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn-ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .btn-ghost:hover { background: var(--accent); color: white; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
  .btn-icon {
    width: 32px; height: 32px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; font-size: 1.1rem; background: var(--tag-bg);
    border: none; cursor: pointer; color: var(--text-secondary);
    transition: all 0.2s;
  }
  .btn-icon:hover { background: var(--accent); color: white; }

  /* Autocomplete */
  .autocomplete-wrapper { position: relative; flex: 1; }
  .autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: 2px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    max-height: 220px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  .autocomplete-list.show { display: block; }
  .autocomplete-item {
    padding: 0.55rem 1rem;
    cursor: pointer;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: background 0.15s;
  }
  .autocomplete-item:hover, .autocomplete-item.active { background: var(--accent-light); }
  .autocomplete-item .cat-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-left: auto;
    background: var(--tag-bg);
    padding: 0.1rem 0.5rem;
    border-radius: 10px;
  }

  /* Selected Ingredients Tags */
  .selected-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 2rem; }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.35rem 0.7rem;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: default;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tag button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  .tag button:hover { opacity: 1; }

  /* Category Quick-Add */
  .category-section { margin-top: 1rem; }
  .category-section summary {
    font-size: 0.88rem;
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: 600;
    user-select: none;
    padding: 0.3rem 0;
  }
  .category-section summary:hover { color: var(--accent); }
  .category-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.5rem;
    padding-top: 0.5rem;
  }
  .category-grid .quick-btn {
    padding: 0.3rem 0.65rem;
    background: var(--tag-bg);
    border: 1.5px solid transparent;
    border-radius: 16px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font);
    color: var(--text);
  }
  .category-grid .quick-btn:hover { border-color: var(--accent); color: var(--accent); }
  .category-grid .quick-btn.selected { background: var(--accent); color: white; border-color: var(--accent); }

  /* What Can I Make button */
  .action-bar {
    display: flex;
    gap: 0.6rem;
    margin-top: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .match-count {
    margin-left: auto;
    font-size: 0.9rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* Filters */
  .filters-bar {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem 1.5rem;
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
  }
  .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .filter-group label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
  .filter-group select {
    padding: 0.45rem 0.7rem;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: var(--font);
    background: var(--card);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  .filter-group select:focus { border-color: var(--accent); }
  .dietary-filters { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .dietary-btn {
    padding: 0.35rem 0.7rem;
    border: 2px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
    color: var(--text-secondary);
  }
  .dietary-btn:hover { border-color: var(--accent); color: var(--accent); }
  .dietary-btn.active { background: var(--tag-active); color: var(--tag-active-text); border-color: var(--tag-active); }

  /* Recipe Grid */
  .recipes-header {
    margin-top: 1.5rem;
    margin-bottom: 0.8rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .recipes-header h2 { font-size: 1.2rem; font-weight: 700; }

  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
    padding-bottom: 3rem;
  }

  /* Recipe Card */
  .recipe-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: all 0.3s;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .recipe-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .recipe-card.highlight { border-color: var(--match-high); }
  .recipe-card.no-match { opacity: 0.55; }
  .recipe-card.highlight .card-badge { display: flex; }

  .card-badge {
    display: none;
    position: absolute;
    top: 0.8rem;
    right: 0.8rem;
    background: var(--match-high);
    color: white;
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
    z-index: 2;
  }

  .card-top {
    position: relative;
    padding: 1.2rem 1.2rem 0.8rem;
  }
  .card-emoji {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    display: block;
  }
  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.3;
  }
  .card-meta {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.5rem;
    flex-wrap: wrap;
  }
  .meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.78rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .meta-chip .icon { font-size: 0.9rem; }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    padding: 0 1.2rem;
    margin-bottom: 0.6rem;
  }
  .card-diet-tag {
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag-vegan { background: #e8f5e9; color: #2e7d32; }
  .tag-vegetarian { background: #f1f8e9; color: #558b2f; }
  .tag-gluten-free { background: #fff3e0; color: #e65100; }
  .tag-dairy-free { background: #e3f2fd; color: #1565c0; }
  .tag-low-carb { background: #fce4ec; color: #c62828; }

  .card-match {
    padding: 0.6rem 1.2rem;
    border-top: 1px solid var(--border);
  }
  .match-bar-outer {
    height: 6px;
    background: var(--tag-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 0.3rem;
  }
  .match-bar-inner {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .match-label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .match-label strong { color: var(--text); }

  /* Expanded Recipe */
  .recipe-detail {
    display: none;
    padding: 0 1.2rem 1.2rem;
    border-top: 1px solid var(--border);
    margin-top: 0.4rem;
    animation: slideDown 0.3s ease;
  }
  .recipe-detail.open { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .detail-section { margin-top: 1rem; }
  .detail-section h3 {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  .ingredient-list { list-style: none; }
  .ingredient-list li {
    padding: 0.3rem 0;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .ingredient-list li .check { font-size: 0.8rem; }
  .ingredient-list li.has-ingredient .check { color: var(--match-high); }
  .ingredient-list li.missing .check { color: var(--match-low); }
  .ingredient-list li.missing { color: var(--text-secondary); }

  .steps-list { list-style: none; counter-reset: step; }
  .steps-list li {
    counter-increment: step;
    padding: 0.5rem 0;
    font-size: 0.9rem;
    display: flex;
    gap: 0.7rem;
    align-items: flex-start;
  }
  .steps-list li::before {
    content: counter(step);
    min-width: 24px;
    height: 24px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 0.1rem;
  }

  .card-expand-hint {
    text-align: center;
    padding: 0.5rem;
    font-size: 0.78rem;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    transition: background 0.2s;
  }
  .recipe-card:hover .card-expand-hint { background: var(--accent-light); color: var(--accent); }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-secondary);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; display: block; }
  .empty-state h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 0.4rem; }

  /* Responsive */
  @media (max-width: 700px) {
    .header h1 { font-size: 1.7rem; }
    .recipe-grid { grid-template-columns: 1fr; }
    .filters-bar { flex-direction: column; align-items: stretch; }
    .action-bar { flex-direction: column; align-items: stretch; }
    .match-count { margin-left: 0; text-align: center; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>&#127869; Recipe Finder</h1>
  <p>Tell me what you have, I'll tell you what you can cook!</p>
</div>

<div class="container">
  <div class="input-section">
    <h2>&#128269; Add your ingredients</h2>
    <div class="input-row">
      <div class="autocomplete-wrapper">
        <input type="text" class="ingredient-input" id="ingredientInput" placeholder="Type an ingredient (e.g. chicken, rice, garlic...)" autocomplete="off">
        <div class="autocomplete-list" id="autocompleteList"></div>
      </div>
      <button class="btn btn-primary" onclick="addIngredient()">Add</button>
    </div>
    <div class="selected-tags" id="selectedTags"></div>

    <details class="category-section">
      <summary>&#127859; Browse ingredients by category</summary>
      <div id="categoryBrowser"></div>
    </details>

    <div class="action-bar">
      <button class="btn btn-ghost" onclick="showWhatICanMake()">&#9889; What Can I Make Now?</button>
      <button class="btn btn-secondary btn-sm" onclick="clearAll()">Clear All</button>
      <span class="match-count" id="matchCount"></span>
    </div>
  </div>

  <div class="filters-bar">
    <div class="filter-group">
      <label>Sort By</label>
      <select id="sortBy" onchange="renderRecipes()">
        <option value="match">Best Match</option>
        <option value="time">Cook Time</option>
        <option value="name">Name A–Z</option>
        <option value="difficulty">Difficulty</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Meal Type</label>
      <select id="mealFilter" onchange="renderRecipes()">
        <option value="all">All Meals</option>
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
        <option value="snack">Snack</option>
        <option value="dessert">Dessert</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Difficulty</label>
      <select id="diffFilter" onchange="renderRecipes()">
        <option value="all">All Levels</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Dietary</label>
      <div class="dietary-filters" id="dietaryFilters">
        <button class="dietary-btn" data-diet="vegetarian" onclick="toggleDiet(this)">Vegetarian</button>
        <button class="dietary-btn" data-diet="vegan" onclick="toggleDiet(this)">Vegan</button>
        <button class="dietary-btn" data-diet="gluten-free" onclick="toggleDiet(this)">Gluten-Free</button>
        <button class="dietary-btn" data-diet="dairy-free" onclick="toggleDiet(this)">Dairy-Free</button>
        <button class="dietary-btn" data-diet="low-carb" onclick="toggleDiet(this)">Low-Carb</button>
      </div>
    </div>
  </div>

  <div class="recipes-header">
    <h2 id="recipesTitle">All Recipes</h2>
  </div>
  <div class="recipe-grid" id="recipeGrid"></div>
</div>

<script>
// ============ INGREDIENT CATEGORIES ============
const INGREDIENT_CATEGORIES = {

  "Vegetables": ["onion","garlic","tomato","potato","carrot","broccoli","spinach","bell pepper","mushroom","zucchini","corn","peas","celery","cucumber","lettuce","kale","sweet potato","cauliflower","green beans","asparagus","eggplant","jalapeño","avocado"],

  "Baking": ["sugar","brown sugar","honey","maple syrup","baking powder","baking soda","vanilla extract","chocolate chips","cocoa powder","cornstarch"],

  {

  {

    steps: ["Heat oil in a large pot, cook diced onion, carrot, and celery 5 minutes.","Add garlic, cook 1 minute.","Add chicken broth and bring to a boil.","Add chicken breast, thyme, and bay leaf.","Simmer 15 minutes until chicken is cooked through.","Remove chicken, shred with forks.","Add noodles to the broth, cook until tender.","Return chicken to the pot, season and serve hot."]
  },
  {
    name: "Guacamole", emoji: "🥑",
    time: 5, difficulty: "Easy", meal: "snack",
    diet: ["vegan","gluten-free","dairy-free","low-carb"],
    ingredients: ["avocado","lime juice","onion","cilantro","jalapeño","salt","tomato"],
    steps: ["Halve avocados, remove pit, scoop into a bowl.","Mash to desired texture with a fork.","Dice onion, tomato, and jalapeño finely.","Chop cilantro.","Fold everything together with lime juice and salt.","Taste and adjust seasoning.","Serve immediately with chips."]
  },
  {
    name: "Crispy Tofu", emoji: "🧊",
    time: 25, difficulty: "Medium", meal: "dinner",
    diet: ["vegan","dairy-free"],
    ingredients: ["tofu","soy sauce","cornstarch","garlic","ginger","sesame oil","vegetable oil","green beans"],
    steps: ["Press tofu 15 minutes to remove water, then cube.","Toss tofu cubes in cornstarch until coated.","Heat vegetable oil in a pan over medium-high heat.","Fry tofu until golden and crispy on all sides, about 8 minutes.","Remove tofu, sauté green beans in the same pan.","Make sauce: mix soy sauce, minced garlic, ginger, and sesame oil.","Return tofu to pan, pour sauce over, toss to coat."]
  }
];

// ============ APP STATE ============
let selectedIngredients = [];
let activeDietary = new Set();
let showOnlyAvailable = false;

// ============ INGREDIENT DATA ============
const allIngredients = [];
for (const [cat, items] of Object.entries(INGREDIENT_CATEGORIES)) {
  for (const item of items) {
    if (!allIngredients.find(i => i.name === item)) {
      allIngredients.push({ name: item, category: cat });
    }
  }
}

// ============ AUTOCOMPLETE ============
const input = document.getElementById('ingredientInput');
const list = document.getElementById('autocompleteList');
let activeIndex = -1;

input.addEventListener('input', () => {
  const val = input.value.toLowerCase().trim();
  if (!val) { list.classList.remove('show'); return; }
  const matches = allIngredients
    .filter(i => i.name.includes(val) && !selectedIngredients.includes(i.name))
    .slice(0, 8);
  if (!matches.length) { list.classList.remove('show'); return; }
  list.innerHTML = matches.map((m, idx) =>
    `<div class="autocomplete-item" data-idx="${idx}" data-name="${m.name}">
      <span>${m.name}</span><span class="cat-label">${m.category}</span>
    </div>`
  ).join('');
  list.classList.add('show');
  activeIndex = -1;
  list.querySelectorAll('.autocomplete-item').forEach(item => {
    item.addEventListener('click', () => {
      addIngredientByName(item.dataset.name);
      input.value = '';
      list.classList.remove('show');
    });
  });
});

input.addEventListener('keydown', (e) => {
  const items = list.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && items[activeIndex]) {
      addIngredientByName(items[activeIndex].dataset.name);
      input.value = '';
      list.classList.remove('show');
    } else if (input.value.trim()) {
      addIngredient();
    }
  } else if (e.key === 'Escape') {
    list.classList.remove('show');
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.autocomplete-wrapper')) list.classList.remove('show');
});

// ============ INGREDIENT MANAGEMENT ============
function addIngredient() {
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  addIngredientByName(val);
  input.value = '';
}

function addIngredientByName(name) {
  if (selectedIngredients.includes(name)) return;
  selectedIngredients.push(name);
  renderSelectedTags();
  renderCategoryBrowser();
  renderRecipes();
}

function removeIngredient(name) {
  selectedIngredients = selectedIngredients.filter(i => i !== name);
  renderSelectedTags();
  renderCategoryBrowser();
  renderRecipes();
}

function clearAll() {
  selectedIngredients = [];
  showOnlyAvailable = false;
  renderSelectedTags();
  renderCategoryBrowser();
  renderRecipes();
}

function showWhatICanMake() {
  showOnlyAvailable = !showOnlyAvailable;
  const btn = document.querySelector('.btn-ghost');
  if (showOnlyAvailable) {
    btn.style.background = 'var(--accent)';
    btn.style.color = 'white';
    btn.textContent = '⚡ Showing: What I Can Make';
  } else {
    btn.style.background = '';
    btn.style.color = '';
    btn.textContent = '⚡ What Can I Make Now?';
  }
  renderRecipes();
}

// ============ DIETARY FILTERS ============
function toggleDiet(btn) {
  const diet = btn.dataset.diet;
  if (activeDietary.has(diet)) {
    activeDietary.delete(diet);
    btn.classList.remove('active');
  } else {
    activeDietary.add(diet);
    btn.classList.add('active');
  }
  renderRecipes();
}

// ============ RENDER ============
function renderSelectedTags() {
  const container = document.getElementById('selectedTags');
  container.innerHTML = selectedIngredients.map(i =>
    `<span class="tag">${i}<button onclick="removeIngredient('${i}')">&times;</button></span>`
  ).join('');
}

function renderCategoryBrowser() {
  const container = document.getElementById('categoryBrowser');
  let html = '';
  for (const [cat, items] of Object.entries(INGREDIENT_CATEGORIES)) {
    const unique = [...new Set(items)];
    html += `<details open><summary style="margin-top:0.6rem">${cat}</summary><div class="category-grid">`;
    for (const item of unique) {
      const sel = selectedIngredients.includes(item);
      html += `<button class="quick-btn ${sel ? 'selected' : ''}" onclick="${sel ? `removeIngredient('${item}')` : `addIngredientByName('${item}')`}">${sel ? '✓ ' : ''}${item}</button>`;
    }
    html += `</div></details>`;
  }
  container.innerHTML = html;
}

function getRecipeMatch(recipe) {
  if (selectedIngredients.length === 0) return { count: 0, total: recipe.ingredients.length, pct: 0, missing: recipe.ingredients };
  const matched = recipe.ingredients.filter(i => selectedIngredients.includes(i));
  const missing = recipe.ingredients.filter(i => !selectedIngredients.includes(i));
  return { count: matched.length, total: recipe.ingredients.length, pct: Math.round((matched.length / recipe.ingredients.length) * 100), missing, matched };
}

function getMatchColor(pct) {
  if (pct >= 80) return 'var(--match-high)';
  if (pct >= 50) return 'var(--match-mid)';
  return 'var(--match-low)';
}

function getDiffOrder(d) { return d === 'Easy' ? 1 : d === 'Medium' ? 2 : 3; }

function renderRecipes() {
  const grid = document.getElementById('recipeGrid');
  const sortBy = document.getElementById('sortBy').value;
  const mealFilter = document.getElementById('mealFilter').value;
  const diffFilter = document.getElementById('diffFilter').value;

  let recipes = RECIPES.map(r => ({ ...r, match: getRecipeMatch(r) }));

  // Filter by meal
  if (mealFilter !== 'all') recipes = recipes.filter(r => r.meal === mealFilter);
  // Filter by difficulty
  if (diffFilter !== 'all') recipes = recipes.filter(r => r.difficulty === diffFilter);
  // Filter by dietary
  if (activeDietary.size > 0) {
    recipes = recipes.filter(r => {
      for (const d of activeDietary) {
        if (!r.diet.includes(d)) return false;
      }
      return true;
    });
  }
  // Filter: show only available
  if (showOnlyAvailable) {
    recipes = recipes.filter(r => r.match.pct >= 80);
  }

  // Sort
  if (sortBy === 'match') {
    recipes.sort((a, b) => b.match.pct - a.match.pct || a.time - b.time);
  } else if (sortBy === 'time') {
    recipes.sort((a, b) => a.time - b.time);
  } else if (sortBy === 'name') {
    recipes.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortBy === 'difficulty') {
    recipes.sort((a, b) => getDiffOrder(a.difficulty) - getDiffOrder(b.difficulty) || b.match.pct - a.match.pct);
  }

  // Match count
  const matchCountEl = document.getElementById('matchCount');
  const fullMatch = recipes.filter(r => r.match.pct === 100).length;
  const partialMatch = recipes.filter(r => r.match.pct >= 50 && r.match.pct < 100).length;
  if (selectedIngredients.length > 0) {
    matchCountEl.textContent = `${fullMatch} exact matches · ${partialMatch} partial · ${recipes.length} total shown`;
  } else {
    matchCountEl.textContent = `${recipes.length} recipes`;
  }

  // Title
  const title = document.getElementById('recipesTitle');
  if (showOnlyAvailable) title.textContent = 'What You Can Make';
  else if (selectedIngredients.length > 0) title.textContent = 'Matching Recipes';
  else title.textContent = 'All Recipes';

  if (!recipes.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="emoji">🔍</span><h3>No recipes match your filters</h3><p>Try removing some filters or adding more ingredients</p></div>`;
    return;
  }

  grid.innerHTML = recipes.map((r, idx) => {
    const highlight = r.match.pct >= 80 && selectedIngredients.length > 0;
    const noMatch = r.match.pct === 0 && selectedIngredients.length > 0;
    const dietTags = r.diet.map(d => `<span class="card-diet-tag tag-${d}">${d}</span>`).join('');

    const ingredientListHTML = r.ingredients.map(ing => {
      const has = selectedIngredients.includes(ing);
      return `<li class="${has ? 'has-ingredient' : 'missing'}"><span class="check">${has ? '✅' : '❌'}</span>${ing}</li>`;
    }).join('');

    const stepsHTML = r.steps.map(s => `<li>${s}</li>`).join('');

    return `<div class="recipe-card ${highlight ? 'highlight' : ''} ${noMatch && selectedIngredients.length > 0 ? 'no-match' : ''}" onclick="toggleDetail(${idx})">
      <span class="card-badge">Can Make!</span>
      <div class="card-top">
        <span class="card-emoji">${r.emoji}</span>
        <div class="card-title">${r.name}</div>
        <div class="card-meta">
          <span class="meta-chip"><span class="icon">⏱️</span>${r.time} min</span>
          <span class="meta-chip"><span class="icon">📊</span>${r.difficulty}</span>
          <span class="meta-chip"><span class="icon">${r.meal === 'breakfast' ? '🌅' : r.meal === 'lunch' ? '☀️' : r.meal === 'dinner' ? '🌙' : r.meal === 'snack' ? '🍿' : '🍰'}</span>${r.meal}</span>
        </div>
      </div>
      ${dietTags ? `<div class="card-tags">${dietTags}</div>` : ''}
      <div class="card-match">
        <div class="match-bar-outer"><div class="match-bar-inner" style="width:${r.match.pct}%;background:${getMatchColor(r.match.pct)}"></div></div>
        <div class="match-label"><strong>${r.match.count}/${r.match.total}</strong> ingredients you have (${r.match.pct}%)</div>
      </div>
      <div class="card-expand-hint">Click for full recipe ▾</div>
      <div class="recipe-detail" id="detail-${idx}">
        <div class="detail-section">
          <h3>Ingredients</h3>
          <ul class="ingredient-list">${ingredientListHTML}</ul>
        </div>
        <div class="detail-section">
          <h3>Instructions</h3>
          <ol class="steps-list">${stepsHTML}</ol>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleDetail(idx) {
  const detail = document.getElementById(`detail-${idx}`);
  detail.classList.toggle('open');
  const hint = detail.previousElementSibling;
  if (detail.classList.contains('open')) {
    hint.textContent = 'Click to collapse ▴';
  } else {
    hint.textContent = 'Click for full recipe ▾';
  }
}

// ============ INIT ============
renderCategoryBrowser();
renderRecipes();
</script>
</body>
</html>
